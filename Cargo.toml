[workspace]
resolver = "2"
members = ["crates/*"]
exclude = ["fuzz"]

[workspace.package]
edition = "2021"
version = "0.1.0"
license = "MIT"
rust-version = "1.89"
publish = false

[workspace.dependencies]
# No features here: each crate names the minimal set it needs (libraries: "rt"; tests add
# "macros", "rt-multi-thread" and "time" as dev-dependencies).
tokio = { version = "1.40", default-features = false }
sqlx = { version = "0.8", default-features = false, features = ["sqlite", "runtime-tokio", "macros", "migrate"] }
async-trait = "0.1"
thiserror = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
sha2 = "0.10"
hex = "0.4"
bytes = "1"
mail-parser = "0.9"
argon2 = "0.5"
proptest = "1"
tempfile = "3"
# Dev-only: tests count executed statements through sqlx query events.
tracing = "0.1"
rustix = { version = "1", features = ["fs"] }
rand_core = { version = "0.6", features = ["getrandom"] }
idna = "1"
unicode-normalization = "0.1"
unicode-general-category = "1"
