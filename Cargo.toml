[workspace]
resolver = "2"
members = ["crates/*", "tools/*"]
exclude = ["fuzz", "vendor", "tools/acceptance"]

[workspace.package]
edition = "2021"
version = "0.1.0"
license = "MIT"
rust-version = "1.89"
publish = false
repository = "https://github.com/semi-system/rusty"
homepage = "https://github.com/semi-system/rusty"

[workspace.dependencies]
# No features here: each crate names the minimal set it needs (libraries: "rt"; tests add
# "macros", "rt-multi-thread" and "time" as dev-dependencies).
tokio = { version = "1.40", default-features = false }
sqlx = { version = "0.9", default-features = false, features = ["postgres", "runtime-tokio", "macros", "migrate", "tls-rustls-ring-native-roots"] }
async-trait = "0.1"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1"
sha2 = "0.11"
hex = "0.4"
bytes = "1"
mail-parser = "0.9"
argon2 = "0.6"
proptest = "1"
tempfile = "3"
url = "2"
# Dev-only: tests count executed statements through sqlx query events.
tracing = "0.1"
rustix = { version = "1", features = ["fs"] }
rand_core = { version = "0.6", features = ["getrandom"] }
idna = "1"
unicode-normalization = "0.1"
unicode-general-category = "1"
serde_yaml_ng = "0.10"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
rustls-pki-types = "1"
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
# Service plumbing (U1). No default features: each crate names what it uses.
tokio-util = { version = "0.7", default-features = false }
# SMTP command parsing (U3). Exact pin: the parser is on the attack surface.
smtp-proto = "=0.2.5"
tracing-subscriber = { version = "0.3", default-features = false, features = ["std", "fmt", "json"] }
# Dev certificate only (rusty-svc feature `dev-cert`); ring backend, never aws-lc.
rcgen = { version = "0.14", default-features = false, features = ["crypto", "ring"] }
# Outbound (U5). mail-auth: DKIM sign/verify, SPF, DMARC, and the hickory DNS resolver. No default
# features: its default backend is aws-lc-rs (a second crypto stack); `rust-crypto` is pure Rust.
mail-auth = { version = "=0.15.1", default-features = false, features = ["rust-crypto", "generate", "dns-hickory"] }
# CA certificates of the host for `verified` outbound TLS when no ca_bundle is configured.
rustls-native-certs = "0.8"
base64 = "0.22"
# DKIM key checks on import (the same ring that signs them inside mail-auth and serves TLS in rustls).
ring = "0.17"

# mail-auth with its RSA operations moved from the `rsa` crate (RUSTSEC-2023-0071) to `ring`; see
# vendor/mail-auth/PATCHES.md. Drop when upstream ships a backend free of the advisory.
[patch.crates-io]
mail-auth = { path = "vendor/mail-auth" }
