# Pinned (not "stable") so a new Rust release cannot break `cargo clippy -D warnings` or the
# build by surprise. To bump deliberately: change `channel` to the new version, run
# `bash scripts/ci.sh`, fix any new lints in the same change, and keep `rust-version` in
# Cargo.toml as the minimum supported version.
[toolchain]
channel = "1.99.1"
components = ["clippy", "rustfmt"]
targets = ["x86_64-unknown-linux-musl"]
