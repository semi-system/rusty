# clamd of the `filter` profile: a TCP socket on the filter network, no other way in. Rusty sends the message with INSTREAM (docs/design-filters-and-resolver.md).
Foreground yes
LogTime yes
LogClean no
LogFile /dev/null
TCPSocket 3310
TCPAddr 0.0.0.0
User clamav
# A message above these is refused by the scanner itself; Rusty's [filter] max_scan_bytes keeps it from sending more.
StreamMaxLength 26M
MaxScanSize 100M
MaxFileSize 26M
MaxRecursion 16
MaxFiles 10000
ReadTimeout 30
CommandReadTimeout 10
IdleTimeout 60
MaxThreads 12
ScanPE yes
ScanELF yes
ScanOLE2 yes
ScanPDF yes
ScanArchive yes
ScanHTML yes
AlertEncrypted no
DetectPUA no
