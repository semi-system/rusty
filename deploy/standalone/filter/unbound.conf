# The recursive resolver of the `filter` profile (docs/design-filters-and-resolver.md): validating, caching, answering the filter network only.
server:
    interface: 0.0.0.0
    port: 53
    do-ip6: no
    do-udp: yes
    do-tcp: yes
    # Only the private network of the filter profile may ask; everyone else is refused.
    access-control: 0.0.0.0/0 refuse
    access-control: 10.78.0.0/24 allow
    access-control: 127.0.0.0/8 allow
    username: ""
    chroot: ""
    directory: "/etc/unbound"
    pidfile: ""
    use-syslog: no
    logfile: ""
    verbosity: 1
    hide-identity: yes
    hide-version: yes
    # Hardening (RFC 8020 qname minimisation, 0x20 randomisation, glue and DNSSEC strictness).
    qname-minimisation: yes
    use-caps-for-id: yes
    harden-glue: yes
    harden-dnssec-stripped: yes
    harden-referral-path: yes
    harden-algo-downgrade: yes
    aggressive-nsec: yes
    # DNSSEC validation with the root trust anchor shipped in the image.
    trust-anchor-file: "/var/unbound/root.key"
    num-threads: 2
    msg-cache-size: 32m
    rrset-cache-size: 64m
    prefetch: yes
    cache-min-ttl: 30
    cache-max-ttl: 86400
    # A resolver that is only asked by our own services needs no more than this per second.
    ratelimit: 2000
    unwanted-reply-threshold: 10000000
    private-address: 10.0.0.0/8
    private-address: 172.16.0.0/12
    private-address: 192.168.0.0/16
    private-address: 169.254.0.0/16
    private-address: 127.0.0.0/8
