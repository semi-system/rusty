# A complete Rusty mail server on one host: PostgreSQL, the five mail services (one image each), the admin web and the edge (HAProxy with ACME certificates).
# Run ./setup.sh first (it writes the state directory and pulls the images from the registry; --build builds them from this checkout instead); then `docker compose up -d`. docs/first-mail.md walks through it.
name: rusty

x-hardened: &hardened
  read_only: true
  cap_drop: [ALL]
  security_opt: ["no-new-privileges:true"]
  restart: unless-stopped

services:
  db:
    image: postgres@sha256:3a4264520e121176619f54ff867d12774bc81e95e7b84db58d63bccdb6144b81
    # The postgres entrypoint starts as root to prepare its data directory and then runs the server as uid 999.
    cap_drop: [ALL]
    cap_add: [CHOWN, DAC_OVERRIDE, FOWNER, SETGID, SETUID]
    security_opt: ["no-new-privileges:true"]
    restart: unless-stopped
    environment:
      POSTGRES_DB: rusty
      POSTGRES_PASSWORD_FILE: /run/secrets/pg_postgres
      POSTGRES_INITDB_ARGS: "--auth-host=scram-sha-256 --data-checksums"
    command: [postgres, -c, ssl=on, -c, ssl_cert_file=/pgtls/server.crt, -c, ssl_key_file=/pgtls/server.key, -c, ssl_min_protocol_version=TLSv1.3, -c, hba_file=/etc/postgresql-hba/pg_hba.conf]
    secrets: [pg_postgres]
    volumes:
      - pgdata:/var/lib/postgresql
      - ${RUSTY_STATE:?run ./setup.sh first}/pgtls:/pgtls:ro
      - ${RUSTY_STATE:?run ./setup.sh first}/etc/pg_hba.conf:/etc/postgresql-hba/pg_hba.conf:ro
    networks: [db]
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U postgres -d rusty"]
      interval: 5s
      timeout: 5s
      retries: 20

  db-init:
    image: postgres@sha256:3a4264520e121176619f54ff867d12774bc81e95e7b84db58d63bccdb6144b81
    user: "65532:65532"
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    read_only: true
    restart: "no"
    entrypoint: [/bin/sh, /db-init.sh]
    secrets: [pg_postgres, pg_app, pg_admin, pg_migrator, pg_smtp_in, pg_submission, pg_imap, pg_outbound, pg_gc]
    volumes:
      - ./db-init.sh:/db-init.sh:ro
      - ../db/roles.sql:/roles.sql:ro
      - ${RUSTY_STATE:?run ./setup.sh first}/etc/db-ca.pem:/etc/rusty/db-ca.pem:ro
    networks: [db]
    depends_on:
      db: { condition: service_healthy }

  migrate:
    image: ${RUSTY_REGISTRY:-ghcr.io/semi-system}/rusty:${RUSTY_TAG:-main}
    <<: *hardened
    restart: "no"
    entrypoint: [/usr/local/bin/rustyctl]
    command: [--config, /etc/rusty/migrate.toml, db, migrate]
    secrets: [pg_app, pg_migrator]
    volumes:
      - ${RUSTY_STATE:?run ./setup.sh first}/etc:/etc/rusty:ro
    networks: [db]
    depends_on:
      db-init: { condition: service_completed_successfully }

  # The blob directory is never made implicitly by a production start: this one-shot makes it (and does nothing when it exists).
  blobs-init:
    image: ${RUSTY_REGISTRY:-ghcr.io/semi-system}/rusty:${RUSTY_TAG:-main}
    <<: *hardened
    restart: "no"
    entrypoint: [/usr/local/bin/rustyctl]
    command: [--config, /etc/rusty/gc.toml, blobs, init]
    secrets: [pg_gc]
    volumes:
      - ${RUSTY_STATE:?run ./setup.sh first}/etc:/etc/rusty:ro
      - mail-data:/var/lib/rusty
    networks: [db]

  # Port 25: unauthenticated inbound mail.
  smtp-in:
    image: ${RUSTY_REGISTRY:-ghcr.io/semi-system}/rusty-smtp-in:${RUSTY_TAG:-main}
    <<: *hardened
    tmpfs: [/tmp]
    secrets: [pg_smtp_in]
    volumes:
      - ${RUSTY_STATE:?run ./setup.sh first}/etc:/etc/rusty:ro
      - ${RUSTY_STATE:?run ./setup.sh first}/tls:/etc/rusty-tls:ro
      - ${RUSTY_STATE:?run ./setup.sh first}/keys:/etc/rusty-keys:ro
      - mail-data:/var/lib/rusty
    networks:
      db: {}
      metrics: {}
      app: {}
      filter: {}
    depends_on:
      migrate: { condition: service_completed_successfully }
      blobs-init: { condition: service_completed_successfully }
      cert-sync: { condition: service_healthy, required: false }
    stop_grace_period: 45s

  # Ports 587 and 465: authenticated submission.
  submission:
    image: ${RUSTY_REGISTRY:-ghcr.io/semi-system}/rusty-submission:${RUSTY_TAG:-main}
    <<: *hardened
    tmpfs: [/tmp]
    secrets: [pg_submission]
    volumes:
      - ${RUSTY_STATE:?run ./setup.sh first}/etc:/etc/rusty:ro
      - ${RUSTY_STATE:?run ./setup.sh first}/tls:/etc/rusty-tls:ro
      - ${RUSTY_STATE:?run ./setup.sh first}/keys:/etc/rusty-keys:ro
      - mail-data:/var/lib/rusty
    networks:
      db: {}
      metrics: {}
      app: {}
    depends_on:
      migrate: { condition: service_completed_successfully }
      blobs-init: { condition: service_completed_successfully }
      cert-sync: { condition: service_healthy, required: false }
    stop_grace_period: 45s

  # Ports 143 and 993.
  imap:
    image: ${RUSTY_REGISTRY:-ghcr.io/semi-system}/rusty-imap:${RUSTY_TAG:-main}
    <<: *hardened
    tmpfs: [/tmp]
    secrets: [pg_imap]
    volumes:
      - ${RUSTY_STATE:?run ./setup.sh first}/etc:/etc/rusty:ro
      - ${RUSTY_STATE:?run ./setup.sh first}/tls:/etc/rusty-tls:ro
      - ${RUSTY_STATE:?run ./setup.sh first}/keys:/etc/rusty-keys:ro
      - mail-data:/var/lib/rusty
    networks:
      db: {}
      metrics: {}
      app: {}
    depends_on:
      migrate: { condition: service_completed_successfully }
      blobs-init: { condition: service_completed_successfully }
      cert-sync: { condition: service_healthy, required: false }
    stop_grace_period: 45s

  # The delivery worker: DKIM, relays, DNS and storage checks. No port; it dials out.
  outbound:
    image: ${RUSTY_REGISTRY:-ghcr.io/semi-system}/rusty-outbound:${RUSTY_TAG:-main}
    <<: *hardened
    tmpfs: [/tmp]
    secrets: [pg_outbound]
    volumes:
      - ${RUSTY_STATE:?run ./setup.sh first}/etc:/etc/rusty:ro
      - ${RUSTY_STATE:?run ./setup.sh first}/keys:/etc/rusty-keys:ro
      - mail-data:/var/lib/rusty
    networks:
      db: {}
      metrics: {}
      egress: {}
    depends_on:
      migrate: { condition: service_completed_successfully }
      blobs-init: { condition: service_completed_successfully }
    stop_grace_period: 45s

  # Garbage collection, store upkeep and the periodic jobs. No port.
  gc:
    image: ${RUSTY_REGISTRY:-ghcr.io/semi-system}/rusty-gc:${RUSTY_TAG:-main}
    <<: *hardened
    tmpfs: [/tmp]
    secrets: [pg_gc]
    volumes:
      - ${RUSTY_STATE:?run ./setup.sh first}/etc:/etc/rusty:ro
      - ${RUSTY_STATE:?run ./setup.sh first}/keys:/etc/rusty-keys:ro
      - mail-data:/var/lib/rusty
    networks:
      db: {}
      metrics: {}
    depends_on:
      migrate: { condition: service_completed_successfully }
      blobs-init: { condition: service_completed_successfully }
    stop_grace_period: 45s

  # ---- the `filter` profile (docs/design-filters-and-resolver.md): a resolver, a spam scorer, a virus scanner and its signature updater. Start with `./setup.sh --filter ...`.
  # The scanners live on the `filter` network, which has no route out and no database; only the resolver and freshclam also join `egress`.
  resolver:
    profiles: [filter]
    image: klutchell/unbound@sha256:50cbeb32b5838a829a7226b19cb151f9535bd7f9f3190f950780f452fe807478
    <<: *hardened
    cap_add: [NET_BIND_SERVICE]
    tmpfs: [/tmp]
    command: [-d, -c, /etc/unbound/unbound.conf]
    volumes:
      - ./filter/unbound.conf:/etc/unbound/unbound.conf:ro
    networks:
      filter: { ipv4_address: 10.78.0.3 }   # rspamd takes its nameserver as an address: the resolver keeps one
      egress: {}

  rspamd:
    profiles: [filter]
    image: rspamd/rspamd@sha256:02d2ba5f88873619ac77cd003bde78a8e77e3506de0871a7ed08c3080f4d45dd
    <<: *hardened
    tmpfs: [/tmp, "/run/rspamd:uid=11333,gid=11333", "/var/lib/rspamd:uid=11333,gid=11333"]
    volumes:
      - ./filter/rspamd:/etc/rspamd/local.d:ro
    networks:
      filter: {}
    depends_on: [resolver]

  clamd:
    profiles: [filter]
    image: clamav/clamav@sha256:45fe5149fbee5a46509c9848ef20d0c354b7b2323c9369f285939a37cf33422a
    restart: unless-stopped
    cap_drop: [ALL]
    cap_add: [SETUID, SETGID, CHOWN, DAC_OVERRIDE, FOWNER]
    security_opt: ["no-new-privileges:true"]
    environment:
      CLAMAV_NO_FRESHCLAMD: "true"
      CLAMAV_NO_MILTERD: "true"
    tmpfs: [/tmp, /run/clamav]
    volumes:
      - ./filter/clamd.conf:/etc/clamav/clamd.conf:ro
      - clamdb:/var/lib/clamav
    networks:
      filter: {}
    healthcheck:
      # The image's own check pings `localhost`, which resolves to ::1 here while clamd listens on IPv4 only.
      test: [CMD-SHELL, "[ \"$$(echo PING | nc 127.0.0.1 3310)\" = PONG ]"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 120s
    depends_on: [freshclam]

  freshclam:
    profiles: [filter]
    image: clamav/clamav@sha256:45fe5149fbee5a46509c9848ef20d0c354b7b2323c9369f285939a37cf33422a
    restart: unless-stopped
    cap_drop: [ALL]
    cap_add: [SETUID, SETGID, CHOWN, DAC_OVERRIDE, FOWNER]
    security_opt: ["no-new-privileges:true"]
    environment:
      CLAMAV_NO_CLAMD: "true"
      CLAMAV_NO_MILTERD: "true"
    tmpfs: [/tmp]
    volumes:
      - clamdb:/var/lib/clamav
    networks: [egress]

  # ---- the `monitoring` profile (docs/design-metrics.md): a Prometheus that scrapes every replica of every service and evaluates the sample alert rules of deploy/monitoring. Start with `./setup.sh --monitoring ...`.
  # No port is published: reach it with `docker compose exec prometheus ...` or add a port in an override file; send the alerts to your own Alertmanager or remote receiver.
  prometheus:
    profiles: [monitoring]
    image: prom/prometheus@sha256:1f0f50f06acaceb0f5670d2c8a658a599affe7b0d8e78b898c1035653849a702
    <<: *hardened
    user: "65534:65534"
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=15d
      - --web.listen-address=0.0.0.0:9090
    tmpfs: [/tmp]
    volumes:
      - ../monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ../monitoring/rusty.rules.yml:/etc/prometheus/rusty.rules.yml:ro
      - promdata:/prometheus
    networks:
      # The one scraper the services allow (`[metrics] allowed_peers`): it keeps an address.
      metrics: { ipv4_address: 10.79.0.2 }

  # rustyctl for the operator: `docker compose run --rm --name rusty-ctl-1 ctl domain add example.org` (docs/first-mail.md; the name is what the database allows). Not started by `up`.
  ctl:
    profiles: [tools]
    image: ${RUSTY_REGISTRY:-ghcr.io/semi-system}/rusty:${RUSTY_TAG:-main}
    <<: *hardened
    restart: "no"
    entrypoint: [/usr/local/bin/rustyctl, --config, /etc/rusty/ctl.toml]
    secrets: [pg_app]
    volumes:
      - ${RUSTY_STATE:?run ./setup.sh first}/etc:/etc/rusty:ro
      - ${RUSTY_STATE:?run ./setup.sh first}/keys:/etc/rusty-keys:ro
      - mail-data:/var/lib/rusty
    networks: [db]
    depends_on:
      migrate: { condition: service_completed_successfully }

  admin:
    image: ${RUSTY_REGISTRY:-ghcr.io/semi-system}/rusty-admin:${RUSTY_TAG:-main}
    <<: *hardened
    tmpfs: [/tmp]
    secrets: [pg_admin]
    volumes:
      - ${RUSTY_STATE:?run ./setup.sh first}/etc:/etc/rusty:ro
    networks:
      db: {}
      metrics: {}
      app: {}
    depends_on:
      migrate: { condition: service_completed_successfully }

  edge:
    image: haproxy@sha256:2caaf8b1a1ef67f3f1ea9b721f2821675d3ba4500fb518e23884fecb93e8dbaa
    <<: *hardened
    # The process is not root: ports below 1024 need this sysctl (the container's own network namespace).
    sysctls: { net.ipv4.ip_unprivileged_port_start: 0 }
    # No depends_on: the edge starts first (the mail service needs the certificate it hands out); it finds the backends by name at run time.
    tmpfs: [/tmp]
    ports: ["25:25", "80:80", "143:143", "443:443", "465:465", "587:587", "993:993"]
    volumes:
      - ${RUSTY_STATE:?run ./setup.sh first}/etc/haproxy.cfg:/usr/local/etc/haproxy/haproxy.cfg:ro
      - ${RUSTY_STATE:?run ./setup.sh first}/edge:/var/lib/haproxy
      - ${RUSTY_STATE:?run ./setup.sh first}/run:/run/ha
    networks:
      app: { ipv4_address: 10.77.0.2 }   # the edge keeps its address: it owns the host ports (one per host), and the services accept the PROXY header and the admin web connections from it only
      egress: {}

  # Copies the certificate the edge obtained to the files the mail services read for STARTTLS (docs/acme.md). Runs as the mail uid, no network.
  cert-sync:
    profiles: [acme]
    image: haproxy@sha256:2caaf8b1a1ef67f3f1ea9b721f2821675d3ba4500fb518e23884fecb93e8dbaa
    user: "65532:65532"
    group_add: ["99"]
    <<: *hardened
    entrypoint: [/bin/sh, /cert-sync.sh, /run/ha/admin.sock, "@certs/mail.pem", /out, "60"]
    network_mode: none
    volumes:
      - ../edge/cert-sync.sh:/cert-sync.sh:ro
      - ${RUSTY_STATE:?run ./setup.sh first}/run:/run/ha
      - ${RUSTY_STATE:?run ./setup.sh first}/tls:/out
    healthcheck:
      test: [CMD, /bin/sh, -c, "test -s /out/cert.pem && test -s /out/key.pem"]
      interval: 5s
      timeout: 3s
      retries: 60
    depends_on: [edge]

  # Keeps the edge's certificates on disk (as the edge's own uid), so a restarted edge starts with them instead of ordering new ones (docs/acme.md).
  cert-keep-mail: &keep
    profiles: [acme]
    image: haproxy@sha256:2caaf8b1a1ef67f3f1ea9b721f2821675d3ba4500fb518e23884fecb93e8dbaa
    user: "99:99"
    <<: *hardened
    environment: { COMBINED: mail.pem }
    entrypoint: [/bin/sh, /cert-sync.sh, /run/ha/admin.sock, "@certs/mail.pem", /keep, "60"]
    network_mode: none
    volumes:
      - ../edge/cert-sync.sh:/cert-sync.sh:ro
      - ${RUSTY_STATE:?run ./setup.sh first}/run:/run/ha
      - ${RUSTY_STATE:?run ./setup.sh first}/edge/certs:/keep
    depends_on: [edge]

  cert-keep-admin:
    <<: *keep
    environment: { COMBINED: admin.pem }
    entrypoint: [/bin/sh, /cert-sync.sh, /run/ha/admin.sock, "@certs/admin.pem", /keep, "60"]

secrets:
  pg_postgres: { file: "${RUSTY_STATE:?run ./setup.sh first}/secrets/pg_postgres" }
  pg_app: { file: "${RUSTY_STATE:?run ./setup.sh first}/secrets/pg_app" }
  pg_admin: { file: "${RUSTY_STATE:?run ./setup.sh first}/secrets/pg_admin" }
  pg_migrator: { file: "${RUSTY_STATE:?run ./setup.sh first}/secrets/pg_migrator" }
  pg_smtp_in: { file: "${RUSTY_STATE:?run ./setup.sh first}/secrets/pg_smtp_in" }
  pg_submission: { file: "${RUSTY_STATE:?run ./setup.sh first}/secrets/pg_submission" }
  pg_imap: { file: "${RUSTY_STATE:?run ./setup.sh first}/secrets/pg_imap" }
  pg_outbound: { file: "${RUSTY_STATE:?run ./setup.sh first}/secrets/pg_outbound" }
  pg_gc: { file: "${RUSTY_STATE:?run ./setup.sh first}/secrets/pg_gc" }

volumes:
  pgdata:
  mail-data:
  promdata:
  clamdb:

networks:
  # The database is reachable by the services that need it only.
  db: { internal: true }
  # The edge to the services; nothing else on it.
  app:
    internal: true
    ipam: { config: [{ subnet: 10.77.0.0/24 }] }
  # The scanners and their resolver (the `filter` profile): internal, so nothing on it reaches the internet; the resolver and freshclam are also on `egress`.
  filter:
    internal: true
    ipam: { config: [{ subnet: 10.78.0.0/24 }] }
  # The metrics endpoints and the Prometheus that scrapes them, nothing else.
  metrics:
    internal: true
    ipam: { config: [{ subnet: 10.79.0.0/24 }] }
  # Out to the internet: the edge (ACME, inbound ports) and the mail service (outbound delivery).
  egress: {}
