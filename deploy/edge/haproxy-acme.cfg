# HAProxy edge with automatic certificates (ACME HTTP-01), for a real installation. Template: replace example.org and the contact address.
#
# HAProxy 3.4 is the ACME client: it makes the account key and the certificate keys, answers the HTTP-01 challenge on port 80, renews before expiry
# and swaps the certificate in without a reload. No other service holds a TLS private key, and nothing of this is in the admin web: the keys are files
# of the edge (/var/lib/haproxy, mode 0700, owned by the haproxy user), never in the database. Only HTTP-01 is used (names, no wildcard).
# Port 80 must be reachable from the internet. Test with the Let's Encrypt STAGING directory first (below), then switch.

global
    maxconn 4096
    # The acme section is still marked experimental in HAProxy 3.4: it must be allowed explicitly.
    expose-experimental-directives
    log stdout format raw local0
    ssl-server-verify required
    ssl-default-bind-options ssl-min-ver TLSv1.2 no-tls-tickets strict-sni
    ssl-default-bind-ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384
    ssl-default-bind-ciphersuites TLS_AES_128_GCM_SHA256:TLS_AES_256_GCM_SHA384:TLS_CHACHA20_POLY1305_SHA256

defaults
    log global
    mode tcp
    option dontlognull
    timeout connect 3s
    timeout client 30s
    timeout server 30s

# The ACME account. STAGING first: https://acme-staging-v02.api.letsencrypt.org/directory (no rate limits, certificates not trusted).
acme letsencrypt
    directory https://acme-v02.api.letsencrypt.org/directory
    contact admin@example.org
    challenge HTTP-01
    keytype ECDSA
    account-key /var/lib/haproxy/acme/account.key
    map virt@acme

# One certificate for the mail names, one for the admin host. The key and the certificate are written under crt-base; HAProxy renews them on its own.
crt-store certs
    crt-base /var/lib/haproxy/certs
    key-base /var/lib/haproxy/certs
    load crt "mail.pem" acme letsencrypt domains "mail.example.org,imap.example.org,smtp.example.org"
    load crt "admin.pem" acme letsencrypt domains "admin.example.org"

# Port 80: the challenge, and a redirect to HTTPS for everything else.
frontend http_in
    mode http
    bind :80
    timeout http-request 10s
    http-request return status 200 content-type text/plain lf-string "%[path,field(-1,/)].%[path,field(-1,/),map(virt@acme)]" if { path_beg /.well-known/acme-challenge/ }
    http-request redirect scheme https code 308

frontend imaps_in
    bind :993 ssl crt "@certs/mail.pem"
    default_backend be_imap

frontend smtps_in
    bind :465 ssl crt "@certs/mail.pem"
    default_backend be_submission

# The admin host: HTTPS only, from the allow-listed networks only (docs/admin-deploy.md).
frontend admin_https
    mode http
    bind :443 ssl crt "@certs/admin.pem" alpn h2,http/1.1
    timeout http-request 10s
    acl admin_host hdr(host),lower,field(1,:) -m str admin.example.org
    acl admin_net  src 198.51.100.0/24 203.0.113.7
    http-request deny deny_status 421 unless admin_host
    http-request deny deny_status 403 unless admin_net
    default_backend be_admin

backend be_imap
    server imap rusty-imap:1143 send-proxy-v2 init-addr last,libc,none

backend be_submission
    server submission rusty-submission:1587 send-proxy-v2 init-addr last,libc,none

backend be_admin
    mode http
    server admin rusty-admin:8080 check init-addr last,libc,none
