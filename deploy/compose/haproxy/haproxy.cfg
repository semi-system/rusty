global
    maxconn 4096
    tune.ssl.cachesize 20000
    tune.ssl.lifetime 300
    log stdout format raw local0
    ssl-server-verify required
    ssl-default-bind-options ssl-min-ver TLSv1.2 no-tls-tickets strict-sni
    ssl-default-bind-ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384
    ssl-default-bind-ciphersuites TLS_AES_128_GCM_SHA256:TLS_AES_256_GCM_SHA384:TLS_CHACHA20_POLY1305_SHA256
    ssl-default-server-options ssl-min-ver TLSv1.2 no-tls-tickets
    ssl-default-server-ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384
    ssl-default-server-ciphersuites TLS_AES_128_GCM_SHA256:TLS_AES_256_GCM_SHA384:TLS_CHACHA20_POLY1305_SHA256

defaults
    log global
    mode tcp
    option dontlognull
    retries 2
    timeout connect 3s
    timeout client 30s
    timeout server 30s
    timeout client-fin 5s
    timeout server-fin 5s
    timeout tunnel 5m

frontend smtp_in
    bind :10025
    stick-table type ip size 100k expire 30s store conn_cur,conn_rate(10s)
    tcp-request connection track-sc0 src
    tcp-request connection reject if { sc0_conn_cur gt 50 }
    tcp-request connection reject if { sc0_conn_rate gt 100 }
    default_backend smtp_starttls

frontend submission_in
    bind :10587
    stick-table type ip size 100k expire 30s store conn_cur,conn_rate(10s)
    tcp-request connection track-sc0 src
    tcp-request connection reject if { sc0_conn_cur gt 30 }
    tcp-request connection reject if { sc0_conn_rate gt 60 }
    default_backend submission_starttls

frontend imap_in
    bind :10143
    stick-table type ip size 100k expire 30s store conn_cur,conn_rate(10s)
    tcp-request connection track-sc0 src
    tcp-request connection reject if { sc0_conn_cur gt 50 }
    tcp-request connection reject if { sc0_conn_rate gt 100 }
    default_backend imap_starttls

frontend pop3_in
    bind :10110
    stick-table type ip size 100k expire 30s store conn_cur,conn_rate(10s)
    tcp-request connection track-sc0 src
    tcp-request connection reject if { sc0_conn_cur gt 30 }
    tcp-request connection reject if { sc0_conn_rate gt 60 }
    default_backend pop3_starttls

frontend smtps_in
    bind :10465 ssl crt-list /usr/local/etc/haproxy/crt-list.txt
    stick-table type ip size 100k expire 30s store conn_cur,conn_rate(10s)
    tcp-request connection track-sc0 src
    tcp-request connection reject if { sc0_conn_cur gt 30 }
    tcp-request connection reject if { sc0_conn_rate gt 60 }
    default_backend submission_tls

frontend imaps_in
    bind :10993 ssl crt-list /usr/local/etc/haproxy/crt-list.txt
    stick-table type ip size 100k expire 30s store conn_cur,conn_rate(10s)
    tcp-request connection track-sc0 src
    tcp-request connection reject if { sc0_conn_cur gt 50 }
    tcp-request connection reject if { sc0_conn_rate gt 100 }
    default_backend imap_tls

frontend pop3s_in
    bind :10995 ssl crt-list /usr/local/etc/haproxy/crt-list.txt
    stick-table type ip size 100k expire 30s store conn_cur,conn_rate(10s)
    tcp-request connection track-sc0 src
    tcp-request connection reject if { sc0_conn_cur gt 30 }
    tcp-request connection reject if { sc0_conn_rate gt 60 }
    default_backend pop3_tls

frontend http_redirect
    mode http
    bind :10080
    timeout http-request 10s
    http-request deny deny_status 421 unless { hdr(host),lower,field(1,:) -m str web.test }
    http-request redirect scheme https code 308

frontend https_in
    mode http
    bind :10443 ssl crt-list /usr/local/etc/haproxy/crt-list.txt alpn h2,http/1.1
    timeout http-request 10s
    timeout http-keep-alive 30s
    stick-table type ip size 100k expire 30s store conn_cur,conn_rate(10s)
    tcp-request connection track-sc0 src
    tcp-request connection reject if { sc0_conn_cur gt 100 }
    tcp-request connection reject if { sc0_conn_rate gt 200 }
    http-request deny deny_status 421 unless { hdr(host),lower,field(1,:) -m str web.test }
    http-request deny deny_status 413 if { hdr_val(content-length) gt 67108864 }
    default_backend http_tls

backend smtp_starttls
    option tcp-check
    tcp-check connect default
    tcp-check expect string 220
    server smtp be-smtp:1025 check check-send-proxy send-proxy-v2 init-addr last,libc,none

backend submission_starttls
    option tcp-check
    tcp-check connect default
    tcp-check expect string 220
    server submission be-submission:1587 check check-send-proxy send-proxy-v2 init-addr last,libc,none

backend imap_starttls
    option tcp-check
    tcp-check connect default
    tcp-check expect string *\ OK
    server imap be-imap:1143 check check-send-proxy send-proxy-v2 init-addr last,libc,none

backend pop3_starttls
    option tcp-check
    tcp-check connect default
    tcp-check expect string +OK
    server pop3 be-pop3:1110 check check-send-proxy send-proxy-v2 init-addr last,libc,none

backend submission_tls
    option tcp-check
    tcp-check connect default
    server submission be-submission:1465 ssl verify required verifyhost be-submission ca-file /run/rusty-certs/internal-ca.crt crt /run/rusty-certs/edge-client.pem sni str(be-submission) send-proxy-v2 check check-ssl check-sni be-submission check-send-proxy init-addr last,libc,none

backend imap_tls
    option tcp-check
    tcp-check connect default
    server imap be-imap:1993 ssl verify required verifyhost be-imap ca-file /run/rusty-certs/internal-ca.crt crt /run/rusty-certs/edge-client.pem sni str(be-imap) send-proxy-v2 check check-ssl check-sni be-imap check-send-proxy init-addr last,libc,none

backend pop3_tls
    option tcp-check
    tcp-check connect default
    server pop3 be-pop3:1995 ssl verify required verifyhost be-pop3 ca-file /run/rusty-certs/internal-ca.crt crt /run/rusty-certs/edge-client.pem sni str(be-pop3) send-proxy-v2 check check-ssl check-sni be-pop3 check-send-proxy init-addr last,libc,none

backend http_tls
    mode http
    option httpchk
    http-check connect default
    http-check send meth GET uri /health ver HTTP/1.1 hdr host be-http
    http-check expect status 200
    server http be-http:18080 ssl verify required verifyhost be-http ca-file /run/rusty-certs/internal-ca.crt crt /run/rusty-certs/edge-client.pem sni str(be-http) send-proxy-v2 check check-ssl check-sni be-http check-send-proxy init-addr last,libc,none
