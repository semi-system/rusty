# A sample Prometheus scrape configuration for the standalone stack (docs/design-metrics.md): ONE target. The admin web is the central endpoint: it reads the /metrics of every other service
# (every replica of each, found through Docker's DNS) and serves them all on its own listener, each sample labelled `service` and `instance`, with `rusty_scrape_target_up` for each instance, so
# a service that is down shows as 0 and a service cannot be left out of the scrape configuration by mistake. Run your Prometheus on the `rusty_metrics` network (docs/docker.md); the admin web
# allows the networks given to `./setup.sh --metrics-allow` (`[metrics] allowed_peers`).
global:
  scrape_interval: 30s
  evaluation_interval: 30s

rule_files:
  - /etc/prometheus/rusty.rules.yml

scrape_configs:
  - job_name: rusty
    # honor_labels: the samples carry their own `service` and `instance` (the instance of the service, not of the admin web).
    honor_labels: true
    static_configs:
      - targets: ["admin:9100"]
