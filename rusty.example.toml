# Rusty startup configuration. Every key except the two paths is optional.
# Unknown keys are rejected.

# Run the service under its own account with umask 077; /var/lib/rusty is owned by it, 0700.

# SQLite metadata database (absolute path; created with mode 0600 if missing).
database_path = "/var/lib/rusty/meta.sqlite"

# Directory holding the content-addressed message blobs (absolute path). It must be
# initialized once (FsBlobStore::init: mode 0700 plus a .rusty-blobs marker); startup
# refuses a missing, unmarked, symlinked or group/world-writable directory.
blob_dir = "/var/lib/rusty/blobs"

# One of: error, warn, info, debug, trace. Default: info.
# log_level = "info"

# Largest accepted message in bytes, 1024..=1073741824. Default: 52428800 (50 MiB).
# max_message_bytes = 52428800

# Seconds an unreferenced blob is kept before GC may delete it. Minimum 3600. Default: 86400.
# gc_grace_seconds = 604800   # must be >= [outbound] max_age_secs + 86400 (queued bodies are unreferenced blobs)

# ---- Services (U1) ----------------------------------------------------------------------

# Fully qualified name of this server: SMTP/IMAP greeting, certificate SAN, DKIM. Required
# (except under `rusty d --dev`).
# hostname = "mail.example.com"

# "text" (default) or "json".
# log_format = "text"

# TLS terminated by the services themselves. One certificate/key pair (PEM; the certificate
# file may hold the chain). The key file must be a regular file with mode 0600 owned by the
# service account; anything else is refused at start-up. SIGHUP reloads both files; a failed
# reload keeps the old certificate. Listeners that accept authentication (587, 465, 143, 993)
# do not start without a certificate: there is no plaintext fallback.
# [tls]
# cert_file = "/etc/rusty/tls/fullchain.pem"
# key_file  = "/etc/rusty/tls/privkey.pem"
# Development only: generate a self-signed certificate in memory (logged loudly). This is what
# `rusty d --dev` sets; it cannot be combined with cert_file/key_file.
# dev_self_signed = false

# Listener addresses are "host:port"; an empty string disables the listener.
# [smtp]
# listen_25  = "0.0.0.0:25"
# listen_587 = "0.0.0.0:587"
# listen_465 = "0.0.0.0:465"
# max_message_bytes = 52428800   # <= the top-level max_message_bytes
# max_recipients = 100
# max_connections = 1000
# max_connections_per_ip = 20
# proxy_protocol = false          # true is rejected until an edge proxy is supported

# [imap]
# listen_143 = "0.0.0.0:143"
# listen_993 = "0.0.0.0:993"
# max_connections = 1000
# max_connections_per_ip = 50
# proxy_protocol = false

# [outbound]            # keys arrive with the outbound queue

# [limits]
# shutdown_grace_secs = 30   # drain sessions this long on SIGTERM, then cut them (1..=600)
# auth_failures_max = 5      # per (peer IP, identity) inside auth_window_secs
# auth_window_secs = 300
# auth_concurrent_max = 16   # authentication attempts running at once, process-wide
# inflight_message_mib = 1024  # memory all SMTP sessions together may hold for messages in flight (16..=1048576)

# ---- outbound mail (U5) ----
# The worker that delivers mail submitted by your users to other servers. Safe defaults; every key optional.
# [outbound]
# enabled = true                    # false: submission refuses remote recipients (451) instead of queueing them
# max_age_secs = 432000             # give up and bounce after 5 days (gc_grace_seconds must be at least this + 86400)
# backoff_secs = [300, 900, 1800, 3600, 7200, 14400]   # retry delays; the last repeats
# max_concurrent = 20
# max_concurrent_per_domain = 5
# default_tls = "opportunistic"     # none | opportunistic (STARTTLS if offered, certificate not checked) | required | verified
# dkim_dir = "/var/lib/rusty/dkim"  # DKIM keys (0600); unset: no signing. Each key signs when its file exists:
#                                   #   ed25519: rustyctl dkim generate <domain>
#                                   #   RSA (needed by receivers that do not verify ed25519): make one with
#                                   #   openssl genpkey -algorithm RSA -pkeyopt rsa_keygen_bits:2048 -out k.pem
#                                   #   then rustyctl dkim import <domain> k.pem (Rusty does not generate RSA keys)
# dkim_selector = "rusty"
# dkim_ed25519 = true               # false: ignore the ed25519 key file (sign with RSA only)
# bind_address = "192.0.2.7"        # dedicated sending address
# nameserver = "10.77.0.10:53"      # DNS server instead of the system resolver (operator setting)
# ca_bundle = "/etc/rusty/ca.pem"   # CA certificates for `verified` TLS instead of the system store (operator setting)
# max_pending_per_account = 1000    # fairness inside a tenant: queued jobs one account may hold
# submit_window_secs = 3600         # budget window per account:
# submit_max_jobs = 500             #   jobs (one per destination domain),
# submit_max_recipients = 2000      #   recipients and
# submit_max_bytes = 2147483648     #   bytes
# [outbound.tls_policy]             # per destination domain
# "partner.example" = "verified"
# [outbound.relay]                  # send everything through a smarthost instead (ISP blocks port 25)
# host = "smtp.provider.example"
# port = 587
# tls = "starttls"                  # starttls | implicit | none (credentials need TLS)
# username = "mailer"
# password_file = "/etc/rusty/relay.pw"   # mode 0600, never inline
