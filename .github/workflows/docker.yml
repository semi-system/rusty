# Build, publish, sign and scan the container image (deploy/docker/Dockerfile).
#
# Flow:  meta -> smoke (dev-cert variant, local-run scenario) -> publish (one of two jobs, chosen
# by the repository variable DOCKER_PUBLISH_MODE) -> sign (cosign keyless + SBOM + provenance,
# by DIGEST) and trivy (report). Pull requests only build (push: false); nothing here uses
# secrets other than the job-scoped GITHUB_TOKEN, and there is no pull_request_target.
#
# Image name: ghcr.io/<github.repository, lower-cased>. The repository name is never written in
# this file; a rename is one repository setting. See docs/docker.md.
name: docker

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions: {}

concurrency:
  group: docker-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }} # never cancel a publish that is pushing

jobs:
  meta:
    name: build metadata
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      source-date-epoch: ${{ steps.m.outputs.epoch }}
      version: ${{ steps.m.outputs.version }}
      image: ${{ steps.m.outputs.image }}
      image-changed: ${{ steps.c.outputs.docker }}
      workflow-changed: ${{ steps.c.outputs.workflow }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 2 # pull request: the merge commit and both parents (scripts/ci-changes.sh)
      - name: Compute version, commit time and the lower-case image name
        id: m
        env:
          REPO: ${{ github.repository }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          {
            echo "epoch=$(git log -1 --format=%ct)"
            if [ "$REF_TYPE" = tag ]; then echo "version=${REF_NAME#v}"; else echo "version=0.0.0-dev+${SHA::12}"; fi
            echo "image=ghcr.io/${REPO,,}"
          } >> "$GITHUB_OUTPUT"
      - name: Which inputs changed (pull requests only; pushes and tags build everything)
        id: c
        run: bash scripts/ci-changes.sh | grep -E "^(docker|workflow)=" >> "$GITHUB_OUTPUT"

  # Three independent builds run in parallel (one runner each) instead of one after the other:
  # the production image, the dev-cert variant (different cargo features, so no shared compile) and
  # the arm64 cross compile (zig, no emulation; the same export release.yml uses). Pull requests
  # that touch nothing the image is built from skip all of it.
  smoke:
    name: image smoke test (${{ matrix.variant }})
    needs: meta
    if: ${{ needs.meta.outputs.image-changed == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        variant: [amd64-production, amd64-dev-cert, arm64-compile]
    env:
      SDE: ${{ needs.meta.outputs.source-date-epoch }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Pins match deploy/images.lock
        run: bash scripts/check-docker-pins.sh
      - name: Build the production image and check it
        if: ${{ matrix.variant == 'amd64-production' }}
        run: |
          set -euo pipefail
          docker build -f deploy/docker/Dockerfile --build-arg "SOURCE_DATE_EPOCH=$SDE" -t rusty:smoke .
          bash scripts/check-image.sh rusty:smoke
      - name: Build the dev-cert variant and run the local-run scenario against it
        if: ${{ matrix.variant == 'amd64-dev-cert' }}
        run: |
          set -euo pipefail
          docker build -f deploy/docker/Dockerfile --build-arg DEV_CERT=1 --build-arg "SOURCE_DATE_EPOCH=$SDE" -t rusty:smoke-dev .
          bash scripts/check-image.sh rusty:smoke-dev dev
          IMAGE=rusty:smoke-dev bash tools/acceptance/local-run.sh
      - name: Cross compile the arm64 binary and check it is a static aarch64 ELF
        if: ${{ matrix.variant == 'arm64-compile' }}
        run: |
          set -euo pipefail
          docker buildx build --platform linux/arm64 --target binary \
            -f deploy/docker/Dockerfile --build-arg "SOURCE_DATE_EPOCH=$SDE" \
            --output type=local,dest=out-arm64 .
          file out-arm64/rusty
          file out-arm64/rusty | grep -q 'ARM aarch64'
          file out-arm64/rusty | grep -qE 'statically linked|static-pie linked'

  # Exactly one of the two publish jobs runs. DOCKER_PUBLISH_MODE is a repository VARIABLE (not a
  # secret): unset or "no-scan" runs the plain publish action, "strict" adds the SAST and image
  # scan gate before pushing. Both actions are pinned by commit SHA (never @main).
  publish-no-scan:
    name: publish (no-scan)
    if: ${{ vars.DOCKER_PUBLISH_MODE != 'strict' && (github.event_name != 'pull_request' || needs.meta.outputs.workflow-changed == 'true') }}
    needs: [meta, smoke]
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      contents: read
      packages: write # push to ghcr.io with GITHUB_TOKEN; no other permission
    outputs:
      digest: ${{ steps.publish.outputs.image-digest }}
      image: ${{ steps.publish.outputs.image-name-lc }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build (and push outside pull requests)
        id: publish
        uses: abxst/actions/no-scan@670736025c229e0c308fc9a488cd5f008a96ca74 # v5
        with:
          image-name: ${{ github.repository }}
          context: .
          dockerfile: deploy/docker/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          registry-username: ${{ github.actor }}
          registry-password: ${{ secrets.GITHUB_TOKEN }}
          tags: |
            type=sha,prefix=sha-,format=short
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
          build-args: |
            VERSION=${{ needs.meta.outputs.version }}
            REVISION=${{ github.sha }}
            SOURCE_URL=${{ github.server_url }}/${{ github.repository }}
            SOURCE_DATE_EPOCH=${{ needs.meta.outputs.source-date-epoch }}

  publish-strict:
    name: publish (strict)
    if: ${{ vars.DOCKER_PUBLISH_MODE == 'strict' && (github.event_name != 'pull_request' || needs.meta.outputs.workflow-changed == 'true') }}
    needs: [meta, smoke]
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.publish.outputs.image-digest }}
      image: ${{ steps.publish.outputs.image-name-lc }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Semgrep, build, Trivy gate, then push
        id: publish
        uses: abxst/actions/strict@670736025c229e0c308fc9a488cd5f008a96ca74 # v5
        with:
          image-name: ${{ github.repository }}
          context: .
          dockerfile: deploy/docker/Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          registry-username: ${{ github.actor }}
          registry-password: ${{ secrets.GITHUB_TOKEN }}
          gate-severity: HIGH,CRITICAL
          gate-ignore-unfixed: "true"
          tags: |
            type=sha,prefix=sha-,format=short
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
          build-args: |
            VERSION=${{ needs.meta.outputs.version }}
            REVISION=${{ github.sha }}
            SOURCE_URL=${{ github.server_url }}/${{ github.repository }}
            SOURCE_DATE_EPOCH=${{ needs.meta.outputs.source-date-epoch }}

  # Neither publish action signs or attests. Everything below refers to the pushed DIGEST, never
  # to a tag, and runs only when something was pushed.
  sign:
    name: sign, SBOM and provenance
    if: ${{ always() && github.event_name != 'pull_request' && (needs.publish-no-scan.result == 'success' || needs.publish-strict.result == 'success') }}
    needs: [publish-no-scan, publish-strict]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write # cosign and the attestations push signatures to the registry
      id-token: write # OIDC token for keyless signing (Sigstore Fulcio) and the provenance attestation
      attestations: write # GitHub artifact attestation
    env:
      DIGEST: ${{ needs.publish-no-scan.outputs.digest || needs.publish-strict.outputs.digest }}
      IMAGE_LC: ${{ needs.publish-no-scan.outputs.image || needs.publish-strict.outputs.image }}
    steps:
      - name: Fail closed unless the digest is a real sha256
        run: |
          if ! [[ "${DIGEST}" =~ ^sha256:[0-9a-f]{64}$ ]]; then echo "::error::the publish job returned no valid image digest (got: ${DIGEST:-empty})"; exit 1; fi
      - uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Keyless cosign signature of the digest
        run: cosign sign --yes "ghcr.io/${IMAGE_LC}@${DIGEST}"
      - name: SBOM (SPDX) of the digest
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          image: ghcr.io/${{ env.IMAGE_LC }}@${{ env.DIGEST }}
          format: spdx-json
          output-file: sbom.spdx.json
          upload-artifact: true
          upload-release-assets: false
      - name: Attach the SBOM as a signed cosign attestation
        run: cosign attest --yes --type spdxjson --predicate sbom.spdx.json "ghcr.io/${IMAGE_LC}@${DIGEST}"
      # GitHub artifact attestations need a public repository or a paid plan; the cosign signature and the
      # cosign SBOM attestation above already cover private repositories.
      - name: Build provenance attestation
        if: ${{ !github.event.repository.private }}
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ghcr.io/${{ env.IMAGE_LC }}
          subject-digest: ${{ env.DIGEST }}
          push-to-registry: true
      - name: Verify what was just signed (same command as docs/docker.md)
        env:
          REPO: ${{ github.repository }}
          SERVER: ${{ github.server_url }}
        run: |
          cosign verify \
            --certificate-identity-regexp "^${SERVER}/${REPO}/\.github/workflows/docker\.yml@" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            "ghcr.io/${IMAGE_LC}@${DIGEST}" >/dev/null
          echo "signature verified for ${DIGEST}"

  # Informational unless the repository variable DOCKER_TRIVY_BLOCKING is "true". In strict mode
  # the publish action's own gate is the blocking one. Reviewed exceptions: .trivyignore only.
  trivy:
    name: Trivy report
    if: ${{ always() && github.event_name != 'pull_request' && (needs.publish-no-scan.result == 'success' || needs.publish-strict.result == 'success') }}
    needs: [publish-no-scan, publish-strict]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      packages: read
    env:
      DIGEST: ${{ needs.publish-no-scan.outputs.digest || needs.publish-strict.outputs.digest }}
      IMAGE_LC: ${{ needs.publish-no-scan.outputs.image || needs.publish-strict.outputs.image }}
    steps:
      - name: Fail closed unless the digest is a real sha256
        run: |
          if ! [[ "${DIGEST}" =~ ^sha256:[0-9a-f]{64}$ ]]; then echo "::error::the publish job returned no valid image digest (got: ${DIGEST:-empty})"; exit 1; fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Scan the pushed digest (HIGH, CRITICAL)
        continue-on-error: ${{ vars.DOCKER_TRIVY_BLOCKING != 'true' }}
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        env:
          TRIVY_USERNAME: ${{ github.actor }}
          TRIVY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
        with:
          image-ref: ghcr.io/${{ env.IMAGE_LC }}@${{ env.DIGEST }}
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          trivyignores: .trivyignore
          format: json
          output: trivy-report.json
          exit-code: ${{ vars.DOCKER_TRIVY_BLOCKING == 'true' && '1' || '0' }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ always() }}
        with:
          name: trivy-report
          path: trivy-report.json
          if-no-files-found: ignore
          retention-days: 30

  # One result for the whole workflow (optional required check, see docs/ci.md): fails when any job
  # failed or was cancelled, passes when jobs were skipped (nothing the image is built from changed,
  # the other publish mode, pull request without publishing).
  docker-ok:
    name: docker-ok
    if: ${{ always() }}
    needs: [meta, smoke, publish-no-scan, publish-strict, sign, trivy]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Every job succeeded or was skipped
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
          META: ${{ needs.meta.result }}
        run: |
          set -euo pipefail
          [ "$META" = success ] || { echo "::error::the build metadata job did not succeed ($META)"; exit 1; }
          ok=1
          for r in $RESULTS; do
            case "$r" in success|skipped) ;; *) ok=0 ;; esac
          done
          [ "$ok" = 1 ] || { echo "::error::a job failed or was cancelled"; exit 1; }
          echo "docker-ok: all jobs succeeded or were skipped"
