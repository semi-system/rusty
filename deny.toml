# cargo-deny policy. Run: cargo deny check
[graph]
targets = [
    "x86_64-unknown-linux-gnu",
    "x86_64-unknown-linux-musl",
]

[advisories]
version = 2
yanked = "deny"
# Semantics (from cargo-deny 0.20 source/CHANGELOG, PR#753): "workspace" makes unmaintained
# advisories an ERROR only when the crate is a direct dependency of a workspace member;
# unmaintained transitive crates are not reported by cargo-deny at all. Those are surfaced
# as warnings by `cargo audit` in scripts/ci.sh. (No unmaintained crate exists today, so
# this was verified from the source/changelog, not by an observed failure.)
unmaintained = "workspace"
ignore = [
    { id = "RUSTSEC-2026-0459", reason = "RUSTSEC-2026-0459 / CVE-2026-119375 (bundled SQLite < 3.54.0 returns uninitialised page-cache memory when a database is opened together with a crafted sibling -wal file of a different page size). No fix is obtainable: the fix needs libsqlite3-sys >= 0.39, but every released sqlx-sqlite (0.8.6 and 0.9.0) pins libsqlite3-sys <0.36 / <0.38, so the dependency cannot be bumped or [patch]ed without forking sqlx. Exposure: local-only attack; requires the process to open a database file plus -wal that an attacker wrote. Rusty opens only its own system/dev SQLite files created by rustyd under a 0700 state dir (not attacker-supplied files); production user data is on Postgres, SQLite is the dev/test backend. Journal mode cannot avoid it (a crafted db header selects WAL regardless). Review expiry: revisit when sqlx releases with libsqlite3-sys >= 0.39 (check each sqlx release) and no later than 2027-02-01." },
]

[licenses]
version = 2
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Zlib",
    "MPL-2.0",
    "CC0-1.0",
]
confidence-threshold = 0.9

[bans]
multiple-versions = "warn"
wildcards = "deny"
# Path dependencies between our own crates carry no version; registry wildcards stay denied.
allow-wildcard-paths = true
deny = [
    { name = "openssl" },
    { name = "openssl-sys" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
