# cargo-deny policy. Run: cargo deny check
[graph]
targets = [
    "x86_64-unknown-linux-gnu",
    "x86_64-unknown-linux-musl",
]

[advisories]
version = 2
yanked = "deny"
# Semantics (from cargo-deny 0.20 source/CHANGELOG, PR#753): "workspace" makes unmaintained
# advisories an ERROR only when the crate is a direct dependency of a workspace member;
# unmaintained transitive crates are not reported by cargo-deny at all. Those are surfaced
# as warnings by `cargo audit` in scripts/ci.sh. (No unmaintained crate exists today, so
# this was verified from the source/changelog, not by an observed failure.)
unmaintained = "workspace"
# RUSTSEC-2026-0543: chrono is unmaintained (an informational advisory, no vulnerability, "no safe upgrade is available"). rusty-imap names chrono's types because imap-types hands it dates as
# `chrono::NaiveDate` and `chrono::DateTime` (and imap-types itself depends on chrono, so removing our direct dependency would not remove the crate). The way out is a release of imap-codec
# that uses jiff or time; until then this is accepted. Re-check on every imap-codec upgrade, and no later than 2027-03-01.
ignore = [
    { id = "RUSTSEC-2026-0543", reason = "chrono is unmaintained, not vulnerable; it comes with imap-types, which the IMAP codec needs (see the comment above)" },
]

[licenses]
version = 2
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Zlib",
    "MPL-2.0",
    "CC0-1.0",
]
confidence-threshold = 0.9

[bans]
multiple-versions = "warn"
wildcards = "deny"
# Path dependencies between our own crates carry no version; registry wildcards stay denied.
allow-wildcard-paths = true
deny = [
    { name = "openssl" },
    { name = "openssl-sys" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
