[package]
name = "rusty-davd"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
rusty-core = { path = "../rusty-core" }
rusty-dav = { path = "../rusty-dav" }
rusty-directory = { path = "../rusty-directory" }
rusty-http = { path = "../rusty-http" }
rusty-runtime = { path = "../rusty-runtime" }
rusty-store = { path = "../rusty-store" }
rusty-svc = { path = "../rusty-svc" }
rusty-valkey = { path = "../rusty-valkey" }
base64.workspace = true
hex.workspace = true
rand_core.workspace = true
sha2.workspace = true
tokio = { workspace = true, features = ["sync", "rt-multi-thread", "macros", "time", "net", "io-util"] }
tokio-util.workspace = true
tracing.workspace = true

[dev-dependencies]
rusty-directory = { path = "../rusty-directory" }
tempfile.workspace = true
rusty-store = { path = "../rusty-store", features = ["test-fixtures"] }
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "time", "net", "io-util"] }

[[bin]]
name = "rusty-dav"
path = "src/main.rs"
