[package]
name = "rusty-store"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish.workspace = true

[features]
default = ["postgres"]
postgres = ["sqlx/postgres", "sqlx/tls-rustls-ring-native-roots"]
# Test-only fault injection in the Postgres repositories (lock-order, skipped locks, pauses).
# NEVER enable outside this crate's own [dev-dependencies] (self dev-dependency below);
# scripts/check-raw-db.sh and scripts/check-test-knobs.sh enforce that.
test-knobs = ["tokio/sync"]
# Raw SQL fixtures and the Postgres test-database helper for other crates tests. Enable it ONLY from
# [dev-dependencies]; scripts/check-test-fixtures.sh enforces that and that a release build has none of it.
test-fixtures = ["tokio/rt", "dep:url", "dep:tracing"]
# SQL mutation hook for scripts/pg-mutate.sh (src/mutation.rs). No manifest enables it; the runner passes it
# on the command line, and scripts/check-mutation-hook.sh proves a release build contains none of it.
mutation-testing = []

[dependencies]
rusty-core = { path = "../rusty-core" }
rusty-mime = { path = "../rusty-mime" }
async-trait.workspace = true
bytes.workspace = true
sqlx.workspace = true
# spawn and spawn_blocking; "time" for the Postgres retry backoff sleep.
tokio = { workspace = true, features = ["rt", "time", "sync"] }
rustix.workspace = true
rand_core.workspace = true
serde_json.workspace = true
hex.workspace = true
sha2.workspace = true
url = { workspace = true, optional = true }
tracing = { workspace = true, optional = true }

[dev-dependencies]
rusty-store = { path = ".", features = ["test-knobs", "test-fixtures"] }
proptest.workspace = true
tempfile.workspace = true
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "time"] }
