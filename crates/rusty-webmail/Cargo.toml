[package]
name = "rusty-webmail"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
rusty-core = { path = "../rusty-core" }
rusty-directory = { path = "../rusty-directory" }
rusty-store = { path = "../rusty-store" }
rusty-svc = { path = "../rusty-svc" }
rusty-valkey = { path = "../rusty-valkey" }
rusty-http = { path = "../rusty-http" }
rusty-runtime = { path = "../rusty-runtime" }
rusty-seal = { path = "../rusty-seal" }
rusty-sieve = { path = "../rusty-sieve" }
zeroize = "1"
rusty-s3 = { path = "../rusty-s3" }
tokio-util = { workspace = true }
tracing.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
hex.workspace = true
hmac.workspace = true
sha1.workspace = true
base64.workspace = true
bytes.workspace = true
rand_core.workspace = true
tokio = { workspace = true, features = ["sync", "rt-multi-thread", "macros", "time"] }

[dev-dependencies]
bytes.workspace = true
rusty-store = { path = "../rusty-store", features = ["test-fixtures"] }
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "time", "net", "io-util"] }
tempfile.workspace = true

[[bin]]
name = "rusty-webmail"
path = "src/main.rs"
