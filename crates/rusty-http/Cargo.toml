[package]
name = "rusty-http"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
rusty-core = { path = "../rusty-core" }
rusty-svc = { path = "../rusty-svc", default-features = false }
async-trait.workspace = true
bytes.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["rt", "time", "sync", "macros"] }
tokio-util.workspace = true
tracing.workspace = true
# The HTTP library and its two helpers: named only inside src/adapter (scripts/wrapped-libs.txt).
hyper = { version = "1", default-features = false, features = ["http1", "server"] }
hyper-util = { version = "0.1", default-features = false, features = ["tokio"] }
http-body-util = "0.1"

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "time", "net", "io-util"] }
