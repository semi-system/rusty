[package]
name = "rusty-admin"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
rusty-core = { path = "../rusty-core" }
rusty-directory = { path = "../rusty-directory" }
rusty-store = { path = "../rusty-store" }
rusty-svc = { path = "../rusty-svc" }
rusty-valkey = { path = "../rusty-valkey" }
rusty-http = { path = "../rusty-http" }
rusty-seal = { path = "../rusty-seal" }
rusty-smtp = { path = "../rusty-smtp", default-features = false }
rusty-runtime = { path = "../rusty-runtime" }
tokio-util = { workspace = true }
tracing.workspace = true
async-trait.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
hex.workspace = true
rand_core.workspace = true
tokio = { workspace = true, features = ["sync", "rt-multi-thread", "macros"] }

[dev-dependencies]
rusty-store = { path = "../rusty-store", features = ["test-fixtures"] }
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "time", "net", "io-util"] }
tempfile.workspace = true

[[bin]]
name = "rusty-admin"
path = "src/main.rs"
