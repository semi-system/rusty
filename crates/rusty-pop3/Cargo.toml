[package]
name = "rusty-pop3"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
rusty-core = { path = "../rusty-core" }
rusty-store = { path = "../rusty-store" }
rusty-svc = { path = "../rusty-svc", default-features = false }
async-trait.workspace = true
bytes.workspace = true
tokio = { workspace = true, features = ["rt", "io-util", "time", "sync", "macros"] }
tokio-util.workspace = true
tracing.workspace = true

[dev-dependencies]
rusty-store = { path = "../rusty-store", features = ["test-fixtures"] }
rusty-directory = { path = "../rusty-directory" }
# The dev certificate for the STLS test.
rusty-svc = { path = "../rusty-svc" }
tempfile.workspace = true
rustls.workspace = true
rustls-pki-types.workspace = true
tokio-rustls.workspace = true
proptest.workspace = true
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "time", "net", "io-util"] }
