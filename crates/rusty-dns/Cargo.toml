[package]
name = "rusty-dns"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
rusty-core = { path = "../rusty-core" }
tokio = { workspace = true, features = ["rt", "net", "time", "sync", "macros", "io-util"] }
tokio-util.workspace = true
# The DNS wire codec: named only inside src/adapter (scripts/wrapped-libs.txt).
hickory-proto = { version = "0.26", default-features = false, features = ["std"] }

[dev-dependencies]
proptest.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "net", "time", "io-util"] }
