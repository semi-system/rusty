[package]
name = "rusty"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish.workspace = true

[features]
# Production builds may use --no-default-features to leave the self-signed dev certificate out.
default = ["dev-cert"]
dev-cert = ["rusty-svc/dev-cert"]

[dependencies]
rusty-core = { path = "../rusty-core" }
rusty-store = { path = "../rusty-store" }
rusty-directory = { path = "../rusty-directory" }
rusty-ctl = { path = "../rusty-ctl" }
rusty-seal = { path = "../rusty-seal" }
rusty-runtime = { path = "../rusty-runtime" }
rusty-smtp = { path = "../rusty-smtp" }
rusty-s3 = { path = "../rusty-s3" }
rusty-svc = { path = "../rusty-svc", default-features = false }
rusty-metrics = { path = "../rusty-metrics" }
rusty-imap = { path = "../rusty-imap" }
rusty-pop3 = { path = "../rusty-pop3" }
rusty-managesieve = { path = "../rusty-managesieve" }
async-trait.workspace = true
tokio = { workspace = true, features = ["rt", "rt-multi-thread", "net", "time", "sync", "signal", "io-util", "macros"] }
tokio-util.workspace = true
tracing.workspace = true
serde_json.workspace = true
rustix = { workspace = true, features = ["process", "termios"] }

[dev-dependencies]
rusty-store = { path = "../rusty-store", features = ["test-fixtures"] }
tempfile.workspace = true
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "time", "net", "io-util"] }
rustls.workspace = true
rcgen = { workspace = true, features = ["pem"] }
base64.workspace = true

[[bin]]
name = "rusty-smtp-in"
path = "src/bin/smtp_in.rs"

[[bin]]
name = "rusty-submission"
path = "src/bin/submission.rs"

[[bin]]
name = "rusty-imap"
path = "src/bin/imap.rs"

[[bin]]
name = "rusty-outbound"
path = "src/bin/outbound.rs"

[[bin]]
name = "rusty-gc"
path = "src/bin/gc.rs"
