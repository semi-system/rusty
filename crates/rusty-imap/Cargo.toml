[package]
name = "rusty-imap"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish.workspace = true

[features]
default = ["postgres"]
# Runs the session suites against Postgres too (needs RUSTY_TEST_PG_URL).
postgres = ["rusty-store/postgres"]

[dependencies]
rusty-core = { path = "../rusty-core" }
rusty-store = { path = "../rusty-store" }
rusty-svc = { path = "../rusty-svc", default-features = false }
# Pinned exactly: the decoder is a security boundary (evaluation in tests/codec_table.rs).
imap-codec = { version = "=1.0.0", features = ["starttls"] }
# Already in the tree through imap-codec (alloc only); the adapter reads dates out of parsed commands.
chrono = { version = "0.4", default-features = false }
async-trait.workspace = true
bytes.workspace = true
tokio = { workspace = true, features = ["rt", "io-util", "time", "sync", "macros"] }
tokio-util.workspace = true
tracing.workspace = true

[dev-dependencies]
rusty-store = { path = "../rusty-store", features = ["test-fixtures"] }
rusty-directory = { path = "../rusty-directory" }
rusty-smtp = { path = "../rusty-smtp" }
# The dev certificate for the STARTTLS tests.
rusty-svc = { path = "../rusty-svc" }
proptest.workspace = true
tempfile.workspace = true
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "time", "net", "io-util"] }
rustls.workspace = true
rustls-pki-types.workspace = true
tokio-rustls.workspace = true
tracing-subscriber.workspace = true
