[package]
name = "rusty-smtp"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
rusty-core = { path = "../rusty-core" }
rusty-directory = { path = "../rusty-directory" }
rusty-mime = { path = "../rusty-mime" }
rusty-store = { path = "../rusty-store" }
rusty-svc = { path = "../rusty-svc", default-features = false }
smtp-proto.workspace = true
async-trait.workspace = true
serde_json.workspace = true
bytes.workspace = true
tokio = { workspace = true, features = ["rt", "time", "io-util", "sync", "macros", "net"] }
tokio-util.workspace = true
tracing.workspace = true
mail-auth.workspace = true
rustls.workspace = true
tokio-rustls.workspace = true
rustls-pki-types.workspace = true
rustls-native-certs.workspace = true
base64.workspace = true
ring.workspace = true
idna.workspace = true
sha2.workspace = true
hex.workspace = true

[dev-dependencies]
rusty-store = { path = "../rusty-store", features = ["test-fixtures"] }
rusty-svc = { path = "../rusty-svc", default-features = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "time", "net", "io-util"] }
tokio-rustls.workspace = true
tracing-subscriber.workspace = true
tempfile.workspace = true
proptest.workspace = true
rcgen = { workspace = true, features = ["pem"] }
