[package]
name = "rusty-smtp"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish.workspace = true

[features]
default = []
# Runs the driver suites against Postgres too (needs RUSTY_TEST_PG_URL).
postgres = ["rusty-store/postgres"]

[dependencies]
rusty-core = { path = "../rusty-core" }
rusty-directory = { path = "../rusty-directory" }
rusty-store = { path = "../rusty-store" }
rusty-svc = { path = "../rusty-svc", default-features = false }
smtp-proto.workspace = true
async-trait.workspace = true
bytes.workspace = true
tokio = { workspace = true, features = ["rt", "time", "io-util", "sync", "macros"] }
tokio-util.workspace = true
tracing.workspace = true

[dev-dependencies]
rusty-store = { path = "../rusty-store", features = ["test-fixtures"] }
rusty-svc = { path = "../rusty-svc", default-features = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "time", "net", "io-util"] }
tokio-rustls.workspace = true
tracing-subscriber.workspace = true
tempfile.workspace = true
proptest.workspace = true
rcgen = { workspace = true, features = ["pem"] }
